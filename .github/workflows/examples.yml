name: examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: requirements.txt matches requirements.in
        run: |
          python -m venv /tmp/tools
          /tmp/tools/bin/pip install uv==0.12.20
          /tmp/tools/bin/uv pip compile requirements.in --python-version 3.12 \
            --exclude-newer 2026-10-01T00:00:00Z --generate-hashes \
            -o requirements.txt --quiet
          git diff --exit-code -- requirements.txt

  example:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-readable-sudoers-with-dict-kv
          - 02-lists-and-dicts-back-and-forth
          - 03-combine-layers-and-quadlets
          - 04-picking-from-lists
          - 05-subelements-and-product
          - 06-set-operations
          - 07-strings-into-structures
          - 08-default-omit-mandatory-ternary
          - 09-forcing-types
          - 10-writing-data-out
          - 11-data-from-other-hosts
          - 12-grouping-and-merging
          - sudo-shell-escapes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ansible-core, the roles and the collection
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/ansible-galaxy role install -r requirements.yml -p roles
          .venv/bin/ansible-galaxy collection install -r requirements.yml -p collections
      - name: The example prints what the entry says
        env:
          EXAMPLE: ${{ matrix.example }}
        run: PATH="$PWD/.venv/bin:$PATH" "$EXAMPLE/run.sh" | diff "$EXAMPLE/expected.txt" -

  # The gate a deployment pipeline would run: render the sudoers files the
  # playbook installs, then refuse any rule that can hand out a root shell.
  sudoers-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ansible-core, the roles and the collection
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/ansible-galaxy role install -r requirements.yml -p roles
          .venv/bin/ansible-galaxy collection install -r requirements.yml -p collections
      - name: Render the sudoers files the playbook would install
        working-directory: sudo-shell-escapes
        run: ../.venv/bin/ansible-playbook render.yml -e variant=safer
      - name: Refuse rules that hand out a root shell
        working-directory: sudo-shell-escapes
        run: ./check-sudoers.sh out/*-40-postgresql
